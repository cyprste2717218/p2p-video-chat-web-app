<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Video Chat Application</title>
	<script src="lib/client.js" type="module" defer></script>
</head>

<body>
	<h1>Video Chat Application</h1>

	<div class="flexChild" id="camera-container">
		<div class="camera-box" id="camera-box">
			<video id="received_video" autoplay></video>
			<video id="local_video" width="320" height="240" autoplay muted></video>
			<button id="hangup-button" disabled>Hang Up</button>
		</div>
	</div>
	<div>
		<span>Current Call ID:</span><span id="current-call-id-display"></span>
	</div>
	<br>
	<div>
		<p>Register/login</p>
		<input type="email" id="email" placeholder="Enter your email">
		<input type="text" id="username" placeholder="Enter your username">
		<input type="password" id="password" placeholder="Enter your password">
		<button id="register-button">Register</button>
		<button id="login-button">Login</button>
		<button id="logout-button">Logout</button>

	</div>

	<div>
		<p>Create/Join Call</p>
		<div>
			<button disabled id="create-call-button">Create Call</button>
		</div>

		<div>
			<input type="text" id="connect-to-call" placeholder="Enter the call ID">
			<button disabled id="connect-button">Connect</button>
		</div>
	</div>

	<div>
		<h2>Chat</h2>
		<div id="call-participants-list"></div>
		<div id="chat-messages"></div>
		<input type="text" id="message" placeholder="Enter your message">
		<button disabed id="send-message">Send</button>
	</div>
</body>


</html>
